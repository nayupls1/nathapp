appId: dev.nathapp.app
productName: NathApp
directories:
  output: release
files:
  - package.json
  - dist/electron/**
  - dist/renderer/**
# The compiled Bun server and the Claude Code binary are native executables,
# so they live outside the asar.
extraResources:
  - from: dist/server
    to: server
    filter:
      - nathapp-server*
      - claude*
      - "!*.map"
# Cookies (web tab logins) encrypted with the key in the OS keychain.
electronFuses:
  enableCookieEncryption: true
linux:
  target: AppImage
  category: Utility
mac:
  target: dmg
win:
  target: nsis
