appId: dev.runebrowser.app
productName: Rune Browser
executableName: rune-browser
directories:
  output: release
  # icon.png (from icon.svg) for macOS and Linux, icon.ico (from icon.png) for Windows
  buildResources: build
files:
  - package.json
  - dist/electron/**
  - dist/renderer/**
# The compiled Bun server and the Claude Code binary are native executables,
# so they live outside the asar.
extraResources:
  - from: dist/server
    to: server
    filter:
      - rune-server*
      - claude*
      - "!*.map"
# Cookies (web tab logins) encrypted with the key in the OS keychain.
electronFuses:
  enableCookieEncryption: true
linux:
  target: AppImage
  category: Utility
mac:
  target: dmg
win:
  target: nsis
  icon: build/icon.ico
